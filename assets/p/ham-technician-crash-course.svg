<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="specHF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="specVHF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="specUHF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#glow1)"/>
  <rect width="1536" height="1024" fill="url(#glow2)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(0,210,255,0.04)" stroke-width="1">
    <line x1="0" y1="128" x2="1536" y2="128"/>
    <line x1="0" y1="256" x2="1536" y2="256"/>
    <line x1="0" y1="384" x2="1536" y2="384"/>
    <line x1="0" y1="512" x2="1536" y2="512"/>
    <line x1="0" y1="640" x2="1536" y2="640"/>
    <line x1="0" y1="768" x2="1536" y2="768"/>
    <line x1="0" y1="896" x2="1536" y2="896"/>
    <line x1="192" y1="0" x2="192" y2="1024"/>
    <line x1="384" y1="0" x2="384" y2="1024"/>
    <line x1="576" y1="0" x2="576" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
    <line x1="960" y1="0" x2="960" y2="1024"/>
    <line x1="1152" y1="0" x2="1152" y2="1024"/>
    <line x1="1344" y1="0" x2="1344" y2="1024"/>
  </g>

  <!-- Radio wave rings (decorative, right side) -->
  <g fill="none" stroke-width="1.5" opacity="0.25">
    <circle cx="1300" cy="200" r="60" stroke="#00d2ff"/>
    <circle cx="1300" cy="200" r="110" stroke="#00d2ff" opacity="0.7"/>
    <circle cx="1300" cy="200" r="165" stroke="#00d2ff" opacity="0.5"/>
    <circle cx="1300" cy="200" r="225" stroke="#00d2ff" opacity="0.3"/>
    <circle cx="1300" cy="200" r="290" stroke="#00d2ff" opacity="0.15"/>
  </g>

  <!-- Antenna icon (right side) -->
  <g fill="none" opacity="0.6">
    <rect x="1284" y="160" width="6" height="110" rx="3" fill="rgba(0,210,255,0.5)"/>
    <polygon points="1287,140 1272,163 1302,163" fill="rgba(0,210,255,0.7)"/>
    <line x1="1270" y1="270" x2="1304" y2="270" stroke="rgba(0,210,255,0.3)" stroke-width="1"/>
    <line x1="1260" y1="280" x2="1314" y2="280" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
  </g>

  <!-- Top label -->
  <text x="80" y="80" font-family="'Courier New', monospace" font-size="14" fill="rgba(0,210,255,0.6)" letter-spacing="6">AMATEUR RADIO · FCC TECHNICIAN CLASS · CRASH COURSE</text>
  <line x1="80" y1="92" x2="600" y2="92" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>

  <!-- Main title -->
  <text x="80" y="230" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2">HAM RADIO</text>
  <text x="80" y="340" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="900" fill="white" letter-spacing="-2" opacity="0.95">TECHNICIAN</text>
  <text x="80" y="430" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="rgba(255,255,255,0.5)" letter-spacing="-1">CRASH COURSE</text>

  <!-- Subtitle tag -->
  <rect x="80" y="460" width="360" height="40" rx="20" fill="rgba(0,210,255,0.1)" stroke="rgba(0,210,255,0.3)" stroke-width="1"/>
  <text x="260" y="485" font-family="'Courier New', monospace" font-size="14" fill="#00d2ff" text-anchor="middle" letter-spacing="3">PASS IN 7 DAYS OR LESS</text>

  <!-- Frequency Spectrum Bar -->
  <text x="80" y="570" font-family="'Courier New', monospace" font-size="12" fill="rgba(0,210,255,0.5)" letter-spacing="4">FREQUENCY SPECTRUM</text>

  <rect x="80" y="585" width="220" height="48" rx="6" fill="url(#specHF)"/>
  <text x="190" y="614" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="rgba(0,0,0,0.8)" text-anchor="middle">HF</text>
  <text x="190" y="628" font-family="'Courier New', monospace" font-size="10" fill="rgba(0,0,0,0.7)" text-anchor="middle">3–30 MHz</text>

  <rect x="308" y="585" width="180" height="48" rx="6" fill="url(#specVHF)"/>
  <text x="398" y="614" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="rgba(0,0,0,0.8)" text-anchor="middle">VHF</text>
  <text x="398" y="628" font-family="'Courier New', monospace" font-size="10" fill="rgba(0,0,0,0.7)" text-anchor="middle">30–300 MHz</text>

  <rect x="496" y="585" width="160" height="48" rx="6" fill="url(#specUHF)"/>
  <text x="576" y="614" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="rgba(0,0,0,0.8)" text-anchor="middle">UHF</text>
  <text x="576" y="628" font-family="'Courier New', monospace" font-size="10" fill="rgba(0,0,0,0.7)" text-anchor="middle">300–3000 MHz</text>

  <!-- Tech privilege badge below spectrum -->
  <rect x="80" y="645" width="576" height="28" rx="6" fill="rgba(0,210,255,0.06)" stroke="rgba(0,210,255,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="368" y="664" font-family="'Courier New', monospace" font-size="11" fill="#00d2ff" text-anchor="middle" letter-spacing="2">★ TECHNICIAN: FULL VHF/UHF + 10M HF VOICE (28.300–28.500 MHz)</text>

  <!-- Quick rule cards row -->
  <!-- Card 1 -->
  <rect x="80" y="720" width="260" height="130" rx="12" fill="rgba(20,28,38,0.8)" stroke="rgba(0,210,255,0.15)" stroke-width="1"/>
  <rect x="80" y="720" width="260" height="4" rx="2" fill="rgba(0,210,255,0.6)"/>
  <text x="100" y="748" font-family="'Courier New', monospace" font-size="11" fill="rgba(0,210,255,0.7)" letter-spacing="3">ID RULES</text>
  <text x="100" y="772" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">① Start of contact</text>
  <text x="100" y="792" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">② Every 10 minutes</text>
  <text x="100" y="812" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">③ End of last TX</text>
  <text x="100" y="838" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,107,53,0.8)">✕ No music · No advertising</text>

  <!-- Card 2 -->
  <rect x="360" y="720" width="260" height="130" rx="12" fill="rgba(20,28,38,0.8)" stroke="rgba(0,255,136,0.15)" stroke-width="1"/>
  <rect x="360" y="720" width="260" height="4" rx="2" fill="rgba(0,255,136,0.6)"/>
  <text x="380" y="748" font-family="'Courier New', monospace" font-size="11" fill="rgba(0,255,136,0.7)" letter-spacing="3">RANGE RULE</text>
  <text x="380" y="772" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)">Height &gt; Power</text>
  <text x="380" y="794" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">VHF/UHF = line of sight</text>
  <text x="380" y="814" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">VHF → open terrain</text>
  <text x="380" y="834" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">UHF → buildings/cities</text>

  <!-- Card 3 -->
  <rect x="640" y="720" width="260" height="130" rx="12" fill="rgba(20,28,38,0.8)" stroke="rgba(199,125,255,0.15)" stroke-width="1"/>
  <rect x="640" y="720" width="260" height="4" rx="2" fill="rgba(199,125,255,0.6)"/>
  <text x="660" y="748" font-family="'Courier New', monospace" font-size="11" fill="rgba(199,125,255,0.7)" letter-spacing="3">OHM'S LAW</text>
  <text x="660" y="782" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="rgba(199,125,255,0.9)">V = I × R</text>
  <text x="660" y="810" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="rgba(0,255,136,0.8)">P = V × I</text>
  <text x="660" y="838" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.4)">Volts · Amps · Ohms · Watts</text>

  <!-- Bottom bar -->
  <line x1="80" y1="900" x2="1456" y2="900" stroke="rgba(0,210,255,0.1)" stroke-width="1"/>
  <text x="80" y="940" font-family="'Courier New', monospace" font-size="13" fill="rgba(0,210,255,0.4)" letter-spacing="2">35 QUESTIONS · 74% TO PASS · 10-YEAR LICENSE</text>
  <text x="1456" y="940" font-family="'Courier New', monospace" font-size="13" fill="rgba(0,210,255,0.3)" text-anchor="end" letter-spacing="1">followorbounce.com/p/ham-technician-crash-course/</text>

  <!-- Decorative signal waves bottom right -->
  <g fill="none" stroke-width="1" opacity="0.12">
    <path d="M 1050 950 Q 1100 900 1150 950 Q 1200 1000 1250 950" stroke="#00ff88"/>
    <path d="M 1050 930 Q 1115 870 1180 930 Q 1245 990 1310 930" stroke="#00ff88"/>
    <path d="M 1050 970 Q 1090 940 1130 970 Q 1170 1000 1210 970" stroke="#00d2ff"/>
  </g>

  <!-- Corner accent -->
  <rect x="0" y="0" width="4" height="1024" fill="url(#accentGrad)"/>
</svg>
